version: "3.8"

services:
  talentai-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentai_enterprise_ats
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_SECRET_KEY=talent-ai-enterprise-docker-secret-2026
      - PORT=5000
      - SAAS_DATABASE_URL=sqlite:////app/data/saas_platform.db
    volumes:
      - talentai_storage:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  talentai_storage:
    name: talentai_enterprise_data
